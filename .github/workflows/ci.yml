name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # Testcontainers (MySQL, Kafka) needs Docker, which is preinstalled on
        # GitHub-hosted ubuntu-latest runners - no extra setup required.
        run: mvn -B test

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: url-shortener-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verification only - not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: url-shortener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
